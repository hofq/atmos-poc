base_path: "./"

components:
  terraform:
    base_path: "components/terraform"
    apply_auto_approve: false
    deploy_run_init: true
    init_run_reconfigure: true
    auto_generate_backend_file: false

stacks:
  base_path: "stack"
  included_paths:
    - "**/**/*"
    - "**/*"
  excluded_paths:
    - "**/_defaults.yaml"
    - "**/**/stage-*"
    - "**/**/env-*"
  name_pattern: "{environment}-{stage}-{namespace}"

logs:
  level: Info
  file: "/dev/stderr"

integrations:
  github:
    gitops:
      infracost-enabled: false
      matrix:
        sort-by: .stack_slug
        group-by: .stack_slug | split("-") | [.[0], .[2]] | join("-")

terraform:
  backend_type: azurerm
  backend:
    azurerm:
      resource_group_name: "ATMOS_POC_JK_Test"
      storage_account_name: "abcd1234"
      container_name: "tfstate"