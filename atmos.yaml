base_path: "./"

components:
  terraform:
    base_path: "components/terraform"
    apply_auto_approve: false
    deploy_run_init: true
    init_run_reconfigure: true
    auto_generate_backend_file: false

stacks:
  base_path: "stack"
  included_paths:
    - "**/**/**/*"
    - "**/**/*"
    - "**/*"
  excluded_paths:
    - "**/_defaults.yaml"
    - "**/**/stage-*"
    - "**/**/env-*"
  name_pattern: "{environment}-{stage}-{app}"

logs:
  level: Info
  file: "/dev/stderr"
